# Sexto Sentido — modo IP (sin dominio). Expone el puerto 8000.
# Cuando haya dominio, cambiar a la versión con Traefik (docker-compose.traefik.yml).
services:
  sexto:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: sexto-sentido
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DOCENTE_TOKEN=${DOCENTE_TOKEN:-docente}
      - SEXTO_DB=/data/historial.db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    volumes:
      - sexto_data:/data
      - ./backend/casos/docente:/app/backend/casos/docente

volumes:
  sexto_data:
