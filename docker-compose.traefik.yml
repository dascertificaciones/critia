# Versión con dominio + HTTPS por el Traefik que ya corre en el VPS (red host,
# resolvedor "letsencrypt"). Uso:
#   docker compose -f docker-compose.traefik.yml up -d --build
# Variables en .env: DOMINIO, DOCENTE_TOKEN
services:
  sexto:
    build: .
    container_name: sexto-sentido
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DOCENTE_TOKEN=${DOCENTE_TOKEN:-docente}
      - SEXTO_DB=/data/historial.db
    volumes:
      - sexto_data:/data
      - ./backend/casos/docente:/app/backend/casos/docente
    labels:
      - traefik.enable=true
      - traefik.http.routers.sexto.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.sexto.entrypoints=websecure
      - traefik.http.routers.sexto.tls.certresolver=letsencrypt
      - traefik.http.services.sexto.loadbalancer.server.url=http://127.0.0.1:8000

volumes:
  sexto_data:
