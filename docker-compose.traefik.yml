# Versión con dominio + HTTPS por el Traefik que ya corre en el VPS (red host,
# resolvedor "letsencrypt"). Uso:
#   docker compose -f docker-compose.traefik.yml up -d --build
# Variables en .env: DOMINIO, DOCENTE_TOKEN
services:
  critia:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: critia
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DOCENTE_TOKEN=${DOCENTE_TOKEN:-docente}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - SEXTO_DB=/data/historial.db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    volumes:
      - critia_data:/data
      - ./backend/casos/docente:/app/backend/casos/docente
    labels:
      - traefik.enable=true
      - traefik.http.routers.critia.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.critia.entrypoints=websecure
      - traefik.http.routers.critia.tls.certresolver=letsencrypt
      - traefik.http.services.critia.loadbalancer.server.url=http://127.0.0.1:8000

volumes:
  critia_data:
