# Versión con dominio + HTTPS por Traefik (el mismo de n8n).
# Uso: docker compose -f docker-compose.traefik.yml up -d --build
services:
  sexto:
    build: .
    container_name: sexto-sentido
    restart: unless-stopped
    environment:
      - DOCENTE_TOKEN=${DOCENTE_TOKEN:-docente}
      - SEXTO_DB=/data/historial.db
    volumes:
      - sexto_data:/data
      - ./backend/casos/docente:/app/backend/casos/docente
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.sexto.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.sexto.entrypoints=websecure
      - traefik.http.routers.sexto.tls.certresolver=mytlschallenge
      - traefik.http.services.sexto.loadbalancer.server.port=8000

volumes:
  sexto_data:

networks:
  traefik:
    external: true
    name: ${RED_TRAEFIK:-n8n-zbnu_default}
