<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critia · Tablero</title>
<link rel="stylesheet" href="assets/css/estilo.css">
<style>
  .contenedor { max-width: 1100px; }
  .tablero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 18px; }
  .equipo-card { border: var(--trazo) solid var(--tinta); border-radius: var(--r); padding: 18px 18px 16px; background: #fff; position: relative; }
  .equipo-card.rojo { --c: var(--rojo); } .equipo-card.azul { --c: var(--azul); }
  .equipo-card.verde { --c: var(--verde); } .equipo-card.amarillo { --c: var(--amarillo); } .equipo-card.violeta { --c: var(--violeta); }
  .equipo-nombre .escudo { width: 44px; height: 44px; }
  .equipo-card.lider { background: var(--ambar-claro); }
  .equipo-nombre { font-family: var(--serif); font-weight: 700; font-size: 24px; text-transform: capitalize; display: flex; align-items: center; gap: 10px; }
  .equipo-nombre .ficha-equipo { width: 18px; height: 18px; }
  .corona { width: 22px; height: 22px; margin-left: auto; color: var(--sello); }
  .gran-numero { font-family: var(--serif); font-weight: 900; font-size: 64px; line-height: 1; color: var(--c); margin: 10px 0 2px; }
  .gran-numero small { font-family: var(--sans); font-size: 14px; color: var(--tinta-suave); font-weight: 400; margin-left: 6px; }
  .barra { height: 10px; border: 2px solid var(--tinta); border-radius: 5px; background: var(--papel); overflow: hidden; margin: 10px 0 14px; }
  .barra > div { height: 100%; background: var(--c); transition: width .6s ease; }
  .detalle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: 13px; color: var(--tinta-suave); }
  .detalle b { display: block; color: var(--tinta); font-size: 20px; font-family: var(--serif); }
  .detalle .ic { width: 18px; height: 18px; display: block; margin-bottom: 2px; }
  .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; color: var(--tinta-suave); font-size: 13px; }
  @media (max-width: 900px) { .tablero { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .tablero { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="contenedor">
  <header class="cabecera">
    <a class="logo" href="index.html"><span class="ojo" id="logo-ojo"></span>Critia</a>
    <div class="jugador"><a class="btn btn-secundario" href="index.html">Volver al mapa</a></div>
  </header>

  <h1>Tablero de la expedición</h1>
  <p class="suave" style="margin:0" id="sub">Sentidos por equipo. Se actualiza solo cada 15 segundos. Nunca muestra nombres de alumnos.</p>
  <div class="mapas-sel" id="mapas-sel"></div>

  <div class="tablero" id="tablero"></div>

  <div class="pie"><div id="hora"></div></div>
  <div class="pie-inst"><img src="assets/img/udemex.png" alt="Universidad Digital del Estado de México"><span>Hack4Edu 2026</span></div>
</div>

<script src="assets/js/iconos.js"></script>
<script src="assets/js/api.js"></script>
<script>
document.getElementById('logo-ojo').innerHTML = ICONO.ojo;
const params = new URLSearchParams(location.search);
const grupoParam = params.get('grupo') || (Sesion.leer() || {}).grupo || '';
let mapaParam = params.get('mapa') ? +params.get('mapa') : 0;
async function pintar() {
  const r = await api('/tablero' + (grupoParam ? `?grupo=${grupoParam}${mapaParam ? '&mapa=' + mapaParam : ''}` : ''));
  const t = r.equipos;
  if (r.grupo) {
    document.getElementById('sub').textContent = `Grupo ${r.grupo.nombre}${r.mapa ? ' · ' + r.mapa.nombre : ' · todos los mapas'} · sentidos por equipo. Se actualiza solo cada 15 segundos. Nunca muestra nombres de alumnos.`;
    const sel = document.getElementById('mapas-sel');
    const mapas = r.mapas || [];
    sel.innerHTML = mapas.length > 1 ? [`<button type="button" class="mapa-tab ${!mapaParam ? 'activo' : ''}" data-id="0">Todo el grupo</button>`]
      .concat(mapas.map(m => `<button type="button" class="mapa-tab ${m.id === mapaParam ? 'activo' : ''}" data-id="${+m.id}">${esc(m.nombre)}<small>${esc(m.docente_nombre || m.docente)}</small></button>`))
      .concat([`<a class="mapa-tab" href="universo.html?grupo=${encodeURIComponent(r.grupo.codigo)}">Ver el universo</a>`]).join('') : (mapas.length ? `<a class="mapa-tab" href="universo.html?grupo=${encodeURIComponent(r.grupo.codigo)}">Ver el universo</a>` : '');
    [...sel.querySelectorAll('button.mapa-tab')].forEach(b => b.onclick = () => { mapaParam = +b.dataset.id; pintar(); });
  }
  const equipos = Object.keys(t);
  const max = Math.max(1, ...equipos.map(e => t[e].sentidos));
  const tope = Math.max(...equipos.map(e => t[e].sentidos));
  document.getElementById('tablero').innerHTML = equipos.map(e => {
    const d = t[e];
    const lider = tope > 0 && d.sentidos === tope;
    return `
      <div class="equipo-card ${e} ${lider ? 'lider' : ''}">
        <div class="equipo-nombre">${escudoHtml(e)}${e} ${lider ? `<span class="corona">${ICONO.bandera}</span>` : ''}</div>
        <div class="gran-numero">${d.sentidos}<small>sentidos</small></div>
        <div class="barra"><div style="width:${Math.round(100 * d.sentidos / max)}%"></div></div>
        <div class="detalle">
          <div><span class="ic">${ICONO.justificar}</span>Justificar<b>${d.justificar}</b></div>
          <div><span class="ic">${ICONO.revisar}</span>Revisar<b>${d.revisar}</b></div>
          <div><span class="ic">${ICONO.calibrar}</span>Calibrar<b>${d.calibrar}</b></div>
        </div>
        <div class="detalle" style="margin-top:12px">
          <div>Casos<b>${d.casos}</b></div>
          <div>Jugadores<b>${d.alumnos}</b></div>
          <div>Insignias<b>${d.insignias}</b></div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('hora').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-MX');
}
pintar();
setInterval(pintar, 15000);
</script>
</body>
</html>
