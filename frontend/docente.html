<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critia · Panel docente</title>
<link rel="stylesheet" href="assets/css/estilo.css">
<style>
  .contenedor { max-width: 1100px; }
  .pestanas { display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 20px; border-bottom: var(--trazo) solid var(--tinta); }
  .pestana { background: transparent; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px; color: var(--tinta-suave); padding: 10px 14px; font-weight: 700; cursor: pointer; font-size: 15px; font-family: var(--sans); }
  .pestana.activa { color: var(--tinta); border-bottom-color: var(--sello); }
  .pestana .n { background: var(--ambar); color: var(--tinta); border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--papel-3); vertical-align: top; }
  th { color: var(--tinta-suave); font-weight: 700; font-size: 13px; border-bottom: var(--trazo) solid var(--tinta); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 6px 0 22px; }
  .kpi { border-top: var(--trazo) solid var(--tinta); padding: 10px 0 0; }
  .kpi b { display: block; font-family: var(--serif); font-weight: 900; font-size: 40px; line-height: 1; color: var(--tinta); }
  .kpi span { font-size: 14px; color: var(--tinta-suave); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 2px solid var(--tinta-suave); color: var(--tinta-suave); background: transparent; }
  .tag.ok { color: var(--hierba); border-color: var(--hierba); } .tag.mal { color: var(--sello); border-color: var(--sello); } .tag.aviso { color: var(--tinta); border-color: var(--ambar); background: var(--ambar-claro); }
  .reflexion-card { border: var(--trazo) solid var(--tinta); border-radius: var(--r); padding: 16px; margin-bottom: 14px; background: #fff; }
  .reflexion-card .texto { background: var(--papel); border-left: 4px solid var(--tinta); padding: 10px 14px; margin: 10px 0; white-space: pre-wrap; font-size: 16px; }
  .rubrica { font-size: 14px; }
  .rubrica label { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 6px 0; cursor: pointer; }
  .rubrica input { width: 18px; height: 18px; accent-color: var(--hierba); }
  .fila-acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .fila-acciones input[type=text] { flex: 1; min-width: 200px; padding: 8px 12px; font-size: 14px; }
  .btn-peq { padding: 8px 14px; font-size: 14px; }
  .caso-detalle { background: var(--papel); border-radius: var(--r); padding: 12px; margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
  .barrita { height: 10px; border: 2px solid var(--tinta); border-radius: 5px; overflow: hidden; display: flex; background: var(--papel); }
  .barrita > i { display: block; height: 100%; }
  .b-ok { background: var(--hierba); } .b-mej { background: var(--ambar); } .b-mal { background: var(--sello); }
  .ficha-equipo { vertical-align: middle; margin-right: 6px; }
  details summary { cursor: pointer; font-weight: 700; }
  .vacio { color: var(--tinta-suave); padding: 24px 0; }
  .caso-edit label { margin-top: 10px; font-size: 14px; }
  .caso-edit input[type=text], .caso-edit textarea { font-size: 15px; padding: 8px 10px; }
  .caso-edit textarea { min-height: 72px; }
  @media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

  /* ---- Panel sencillo: cuatro secciones, tarjetas suaves y más aire ---- */
  body { background: #FAF7F0; }
  .contenedor { max-width: 980px; }
  .cabecera { border-bottom: 1px solid var(--papel-3); }
  .pestanas { border-bottom: 1px solid var(--papel-3); gap: 4px; margin-bottom: 14px; }
  .pestana { font-size: 16px; padding: 12px 16px; min-height: 48px; border-radius: 10px 10px 0 0; }
  .pestana.activa { background: #fff; }
  .subnav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .subnav:empty { display: none; }
  .subnav button { border: 1px solid var(--papel-3); background: #fff; border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; font-weight: 700; color: var(--tinta-suave); cursor: pointer; min-height: 40px; }
  .subnav button.activa { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .subnav .n { background: var(--ambar); color: var(--tinta); border-radius: 999px; padding: 0 7px; margin-left: 6px; font-size: 12px; }
  .reflexion-card, .tarjeta { border: 1px solid var(--papel-3); border-radius: 14px; box-shadow: 0 1px 3px rgba(31,42,68,.06); background: #fff; }
  #login.tarjeta { margin: 30px auto; }
  input[type=text], input[type=password], textarea, select { border-width: 1.5px; border-color: #B9B29F; border-radius: 10px; }
  .btn { border-radius: 10px; } .btn-primario { box-shadow: 0 3px 0 #8E2A1E; } .btn-primario:active { box-shadow: 0 1px 0 #8E2A1E; }
  .crear { background: #fff; border: 1px solid var(--papel-3); border-radius: 18px; padding: 26px 26px 22px; box-shadow: 0 2px 8px rgba(31,42,68,.07); }
  .crear h1 { font-size: 32px; margin: 0 0 6px; }
  .crear #a-tema { font-size: 20px; padding: 14px 16px; margin-top: 12px; }
  .crear-fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 4px; }
  .crear-fila > div { flex: 1 1 200px; }
  .crear .btn-primario { min-height: 52px; font-size: 17px; padding: 0 26px; margin-top: 18px; }
  .avanzado { margin-top: 14px; font-size: 15px; color: var(--tinta-suave); }
  .avanzado label { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 10px 0 6px; }
  .nota-caja { background: var(--ambar-claro); border-radius: 10px; padding: 10px 14px; font-size: 15px; margin-top: 12px; }
  .actividades { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .actividad { background: #fff; border: 1px solid var(--papel-3); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .actividad h3 { font-family: var(--serif); font-size: 20px; margin: 0; }
  .actividad .codigo { font-family: var(--serif); font-weight: 900; font-size: 24px; letter-spacing: 3px; }
  .actividad .fila-acciones { margin-top: auto; padding-top: 6px; }
  .paso-tarea { border-top: 1px solid var(--papel-3); margin-top: 16px; padding-top: 12px; }
  .paso-tarea label { margin: 10px 0 4px; font-size: 13px; color: var(--tinta-suave); }
  .paso-tarea textarea { min-height: 72px; }
  .pt-cab { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 700; font-size: 17px; }
  .pt-cab b { width: 30px; height: 30px; border-radius: 50%; background: var(--tinta); color: #fff; display: grid; place-items: center; font-size: 15px; }
  .pasos-asist { display: flex; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; flex-wrap: wrap; }
  .pasos-asist li { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--papel-3); color: var(--tinta-suave); font-weight: 700; font-size: 14px; }
  .pasos-asist li b { width: 24px; height: 24px; border-radius: 50%; background: var(--papel-3); color: var(--tinta); display: grid; place-items: center; font-size: 13px; }
  .pasos-asist li.activo { border-color: var(--tinta); color: var(--tinta); } .pasos-asist li.activo b { background: var(--sello); color: #fff; }
  .pasos-asist li.hecho b { background: var(--hierba); color: #fff; }
  .gen-lista { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
  .gen-lista li { display: flex; justify-content: space-between; gap: 12px; background: #fff; border: 1px solid var(--papel-3); border-radius: 10px; padding: 10px 14px; }
  .gen-lista .estado { font-size: 14px; color: var(--tinta-suave); white-space: nowrap; }
  .gen-lista li.ok .estado { color: var(--hierba); font-weight: 700; } .gen-lista li.no .estado { color: var(--sello); }
  .gen-lista li.ahora { border-color: var(--ambar); background: var(--ambar-claro); }
  .previa { background: #fff; border: 1px solid var(--papel-3); border-radius: 16px; padding: 22px; box-shadow: 0 2px 8px rgba(31,42,68,.07); }
  .previa h2 { font-size: 26px; margin: 4px 0 10px; }
  .previa .globo-ia { background: #F3EEE2; border-radius: 14px 14px 14px 4px; padding: 14px 16px; white-space: pre-line; font-size: 17px; line-height: 1.55; }
  .previa .preg { font-family: var(--serif); font-weight: 700; font-size: 19px; margin: 16px 0 8px; }
  .previa .op { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--papel-3); border-radius: 10px; margin-top: 6px; }
  .previa .op.ok { border: 2px solid var(--hierba); background: rgba(79,122,74,.08); }
  .previa .op b { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--papel-2); display: grid; place-items: center; font-family: var(--serif); }
  .previa .op.ok b { background: var(--hierba); color: #fff; }
  .previa dl { margin: 16px 0 0; display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; font-size: 15px; }
  .previa dt { color: var(--tinta-suave); font-weight: 700; } .previa dd { margin: 0; }
  .rev-acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; position: sticky; bottom: 0; background: #FAF7F0; padding: 12px 0; }
  .rev-acciones .btn-primario { min-height: 52px; padding: 0 28px; font-size: 17px; }
  .en-asistente .grupos-sel, .en-asistente label:has(+ .grupos-sel), .en-asistente .aprobar-caso, .en-asistente .asignar-caso, .en-asistente .borrar-caso { display: none; }
  .compartir { background: #fff; border: 1px solid var(--papel-3); border-radius: 18px; padding: 28px; text-align: center; box-shadow: 0 2px 8px rgba(31,42,68,.07); }
  .compartir .codigo-grande { font-family: var(--serif); font-weight: 900; font-size: 64px; letter-spacing: 10px; line-height: 1.1; margin: 8px 0; }
  .compartir ol { text-align: left; max-width: 460px; margin: 16px auto; font-size: 17px; } .compartir li { margin: 8px 0; }
  @media (max-width: 600px) { .previa dl { grid-template-columns: 1fr; gap: 2px 0; } .previa dt { margin-top: 8px; } .compartir .codigo-grande { font-size: 44px; letter-spacing: 6px; } .crear { padding: 20px 16px; } }
</style>
</head>
<body>
<div class="contenedor">
  <header class="cabecera">
    <a class="logo" href="index.html"><span class="ojo" id="logo-ojo"></span>Critia <span class="suave" style="font-family:var(--sans);font-weight:400;font-size:14px;margin-left:6px">para docentes</span></a>
    <div class="jugador" id="estado"></div>
  </header>

  <!-- Clave -->
  <section id="login" class="tarjeta" style="max-width:520px">
    <h1>Panel docente</h1>
    <p class="suave">Nada de lo que veas aquí llega a los alumnos.</p>
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" placeholder="tu usuario" autocomplete="username">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" placeholder="tu contraseña" autocomplete="current-password">
    <div class="acciones"><button class="btn btn-primario" id="entrar">Entrar</button></div>
    <p class="peq suave" style="margin-top:14px">¿Eres el administrador? Deja el usuario vacío y escribe la clave de administrador.</p>
  </section>

  <!-- Panel -->
  <section id="panel" class="oculto">
    <nav class="pestanas" id="pestanas" aria-label="Secciones del panel"></nav>
    <div class="subnav" id="subnav"></div>
    <div id="contenido"></div>
  </section>
  <footer class="pie-site">
    <img class="pie-udemex" src="assets/img/udemex.png" alt="Universidad Digital del Estado de México">
    <img class="pie-banner" src="assets/img/hack4edu.jpg" alt="#Hack4Edu · Soluciones para desafíos educativos reales – 2026">
  </footer>
</div>

<script src="assets/js/iconos.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function () {
  document.getElementById('logo-ojo').innerHTML = ICONO.ojo;
  let auth = null;   // {tipo:'admin', clave} | {tipo:'docente', token}
  try { auth = JSON.parse(sessionStorage.getItem('ss_auth') || 'null'); } catch {}
  const H = () => auth?.tipo === 'admin' ? { 'x-admin': auth.clave } : { 'x-sesion': auth?.token || '' };
  let YO = null;     // {admin, usuario, nombre, grupos}
  const $ = s => document.getElementById(s);
  let META = null;

  // Cuatro secciones; cada una agrupa las vistas de antes
  const SECCIONES = {
    inicio: { nombre: 'Inicio', subs: [] },
    revisar: { nombre: 'Por revisar', subs: [['avances', 'Avances de tarea'], ['porAprobar', 'Casos'], ['reflexiones', 'Reflexiones'], ['insignias', 'Insignias']] },
    seguimiento: { nombre: 'Seguimiento', subs: [['resumen', 'Resumen'], ['alumnos', 'Alumnos'], ['alertas', 'Alertas']] },
    ajustes: { nombre: 'Ajustes', subs: [['grupos', 'Grupos y mapas'], ['generar', 'Generar con opciones'], ['banco', 'Banco de casos'], ['profesores', 'Profesores']] },
  };
  let activa = 'inicio';
  const subActiva = { revisar: 'porAprobar', seguimiento: 'resumen', ajustes: 'grupos' };
  let enAsistente = false;   // mientras el asistente de actividad está abierto, no se repinta el contenido
  let elegirSub = true;      // al entrar a una sección sin indicar pestaña, se abre la primera que tenga pendientes
  function irA(seccion, sub) { activa = seccion; if (sub) subActiva[seccion] = sub; elegirSub = !sub; enAsistente = false; return pintarPestanas(); }

  async function abrirPanel() {
    YO = await api('/docente/yo', 'GET', null, H());
    if (YO.admin) { activa = 'ajustes'; subActiva.ajustes = 'profesores'; }
    $('login').classList.add('oculto'); $('panel').classList.remove('oculto');
    META = await api('/meta');
    $('estado').innerHTML = `<span class="peq">${esc(YO.nombre)}</span><a class="btn btn-enlace" href="guia.html" target="_blank">guía</a><button class="btn btn-enlace" id="salir">salir</button>`;
    $('salir').onclick = async () => { if (auth?.tipo === 'docente') { try { await api('/docente/logout', 'POST', null, H()); } catch {} } try { sessionStorage.removeItem('ss_auth'); } catch {} location.reload(); };
    await pintarPestanas();
  }

  async function entrar() {
    const u = $('usuario').value.trim(), c = $('clave').value;
    try {
      if (!u) { auth = { tipo: 'admin', clave: c }; await api('/docente/yo', 'GET', null, H()); }
      else { const s = await api('/docente/login', 'POST', { usuario: u, password: c }); auth = { tipo: 'docente', token: s.token }; }
      try { sessionStorage.setItem('ss_auth', JSON.stringify(auth)); } catch {}
      await abrirPanel();
    } catch (e) { auth = null; toast(u ? 'Usuario o contraseña incorrectos' : 'Clave de administrador incorrecta'); }
  }
  $('entrar').onclick = entrar;
  $('clave').onkeydown = e => { if (e.key === 'Enter') entrar(); };
  $('usuario').onkeydown = e => { if (e.key === 'Enter') $('clave').focus(); };
  if (auth) abrirPanel().catch(() => { auth = null; try { sessionStorage.removeItem('ss_auth'); } catch {} });

  async function pintarPestanas() {
    const [ref, sug, ale, casos] = await Promise.all([
      api('/docente/reflexiones', 'GET', null, H()), api('/docente/sugerencias', 'GET', null, H()),
      api('/docente/alertas', 'GET', null, H()), api('/docente/casos', 'GET', null, H())]);
    const avs = await api('/docente/avances', 'GET', null, H());
    const conteo = { avances: avs.length, porAprobar: casos.filter(c => c.provisional).length, reflexiones: ref.length, insignias: sug.length, alertas: ale.length };
    const deSeccion = { revisar: conteo.avances + conteo.porAprobar + conteo.reflexiones + conteo.insignias, seguimiento: conteo.alertas };
    const visibles = Object.keys(SECCIONES).filter(k => !(YO.admin && k === 'inicio'));
    const subsDe = k => SECCIONES[k].subs.filter(([v]) => YO.admin ? v !== 'grupos' : v !== 'profesores');
    $('pestanas').innerHTML = visibles.map(k => `
      <button class="pestana ${k === activa ? 'activa' : ''}" data-k="${k}"${k === activa ? ' aria-current="page"' : ''}>${SECCIONES[k].nombre}${deSeccion[k] ? `<span class="n">${deSeccion[k]}</span>` : ''}</button>`).join('');
    [...$('pestanas').children].forEach(b => b.onclick = () => irA(b.dataset.k));
    const subs = subsDe(activa);
    if (subs.length && elegirSub) { const conPendientes = subs.find(([v]) => conteo[v]); if (conPendientes) subActiva[activa] = conPendientes[0]; }
    elegirSub = false;
    if (subs.length && !subs.some(([v]) => v === subActiva[activa])) subActiva[activa] = subs[0][0];
    $('subnav').innerHTML = enAsistente ? '' : subs.map(([v, n]) => `<button class="${v === subActiva[activa] ? 'activa' : ''}" data-v="${v}">${n}${conteo[v] ? `<span class="n">${conteo[v]}</span>` : ''}</button>`).join('');
    [...$('subnav').children].forEach(b => b.onclick = () => irA(activa, b.dataset.v));
    if (enAsistente) return;
    await VISTAS[subs.length ? subActiva[activa] : activa]();
  }

  // Mapas de los que el docente es autor (solo en esos puede aprobar casos)
  function misMapas() {
    return (YO?.grupos || []).flatMap(g => (g.mapas || []).filter(m => YO.admin || m.docente === YO.usuario).map(m => ({ ...m, grupo_nombre: g.nombre })));
  }
  function habDe(c) {
    const clave = c.habilidad || (META.postulados.find(p => p.n === c.postulado) || {}).habilidad;
    return (META.marco_teorico?.habilidades || []).find(h => h.clave === clave);
  }
  function habTxt(c) { const h = habDe(c); return h ? `${esc(h.nombre)} <span class="suave">(${esc(h.autor)})</span>` : ''; }
  const nivelEdad = n => ((META?.marco_teorico?.niveles || []).find(x => x.n === n) || {}).edad || '';
  const NIVEL = { 1: ['Automático', 'ok'], 2: ['Aprobación rápida', 'aviso'], 3: ['Lectura completa', 'mal'] };
  function tarjetaCaso(c) {
    return `<div class="reflexion-card caso-edit" data-id="${esc(c.id)}">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
        <div><span class="tag">${esc(c.id)}</span> <span class="tag ${NIVEL[c.nivel_revision]?.[1] || ''}">${NIVEL[c.nivel_revision]?.[0] || ''}</span> ${c.provisional ? '<span class="tag aviso">provisional</span>' : '<span class="tag ok">aprobado</span>'}</div>
        <div class="peq suave">Misión ${c.mision} · postulado ${c.postulado} · ${habTxt(c)}${c.nivel ? ' · <b>nivel ' + c.nivel + '</b>' : ''}${c.tema ? ' · tema: ' + esc(c.tema) : ''}</div>
      </div>
      <label>Título</label><input type="text" class="f-titulo" value="${esc(c.titulo)}">
      <label>Situación</label><textarea class="f-situacion">${esc(c.situacion)}</textarea>
      <label>Pregunta</label><input type="text" class="f-pregunta" value="${esc(c.pregunta)}">
      <label>Opciones <span class="peq suave">(marca la correcta)</span></label>
      ${(c.opciones || []).map((o, i) => `<div style="display:flex;gap:8px;align-items:center;margin:4px 0">
        <input type="radio" name="ok-${esc(c.id)}" value="${i}" ${o.correcta ? 'checked' : ''}>
        <b>${o.clave}</b><input type="text" class="f-op" data-i="${i}" value="${esc(o.texto)}" style="flex:1">
      </div>`).join('')}
      <label>Pista suave <span class="suave peq">(pregunta general que activa la habilidad)</span></label><input type="text" class="f-pista_suave" value="${esc(c.pista_suave || '')}">
      <label>Pista fuerte <span class="suave peq">(señala dónde está el fallo, sin resolverlo)</span></label><input type="text" class="f-pista" value="${esc(c.pista_fuerte || c.pista || '')}">
      <label>Explicación</label><textarea class="f-explicacion">${esc(c.explicacion)}</textarea>
      <label>Reflexión</label><input type="text" class="f-reflexion" value="${esc(c.reflexion || '')}">
      <label>Grupos que verán este caso</label>
      <div class="grupos-sel">${misMapas().map(m => `<label style="display:inline-flex;gap:6px;align-items:center;margin:0 14px 6px 0;font-weight:400"><input type="checkbox" value="${m.id}" ${((c.mapas || []).includes(m.id) || (c.provisional && c.tema && m.nombre === c.tema)) ? 'checked' : ''}> ${esc(m.nombre)} <span class="peq suave">grupo ${esc(m.grupo_nombre)}</span></label>`).join('') || '<span class="peq suave">No tienes mapas todavía. Crea una actividad en Inicio.</span>'}</div>
      <div class="fila-acciones">
        <button class="btn btn-secundario btn-peq guardar-caso">Guardar cambios</button>
        ${c.provisional ? '<button class="btn btn-primario btn-peq aprobar-caso">Aprobar para esos mapas</button>' : '<button class="btn btn-secundario btn-peq asignar-caso">Actualizar mapas</button>'}
        <button class="btn btn-enlace btn-peq borrar-caso" style="color:var(--mal)">Descartar</button>
      </div></div>`;
  }
  function leerTarjeta(card) {
    const ops = [...card.querySelectorAll('.f-op')].map((inp, i) => ({ clave: 'ABC'[i], texto: inp.value, correcta: false, tipo_error: null }));
    const sel = card.querySelector('input[type=radio]:checked');
    const ci = sel ? +sel.value : 1;
    ops.forEach((o, i) => { o.correcta = i === ci; });
    return { titulo: card.querySelector('.f-titulo').value, situacion: card.querySelector('.f-situacion').value,
             pregunta: card.querySelector('.f-pregunta').value, pista: card.querySelector('.f-pista').value,
             pista_fuerte: card.querySelector('.f-pista').value, pista_suave: card.querySelector('.f-pista_suave').value,
             explicacion: card.querySelector('.f-explicacion').value, reflexion: card.querySelector('.f-reflexion').value, opciones: ops };
  }
  function enlazarTarjetas() {
    [...document.querySelectorAll('.caso-edit')].forEach(card => {
      const id = card.dataset.id;
      const guardar = async () => {
        // conserva tipo_error de las incorrectas si existían
        const actual = (await api('/docente/casos', 'GET', null, H())).find(c => c.id === id);
        const cambios = leerTarjeta(card);
        cambios.opciones.forEach((o, i) => { if (!o.correcta) o.tipo_error = (actual?.opciones?.[i]?.tipo_error) || actual?.familia_error || 'acepta_sin_evidencia'; });
        const r = await api(`/docente/casos/${id}`, 'PUT', { cambios }, H());
        if (r && r.avisos && r.avisos.length) toast('Guardado, con avisos: ' + r.avisos.join(' · '), 7000);
        return r;
      };
      card._guardar = guardar;
      card.querySelector('.guardar-caso').onclick = async () => { try { const r = await guardar(); if (!(r && r.avisos && r.avisos.length)) toast('Guardado'); } catch (e) { toast(e.message); } };
      const mapasSel = () => [...card.querySelectorAll('.grupos-sel input:checked')].map(i => +i.value);
      const ap = card.querySelector('.aprobar-caso');
      if (ap) ap.onclick = async () => {
        const ms = mapasSel();
        if (!ms.length) { toast('Marca al menos un mapa'); return; }
        try { await guardar(); await api(`/docente/casos/${id}/aprobar`, 'POST', { mapas: ms }, H()); toast(`Aprobado para ${ms.length} mapa(s)`); card.querySelector('.tag.aviso').outerHTML = '<span class="tag ok">aprobado</span>'; ap.outerHTML = '<button class="btn btn-secundario btn-peq asignar-caso">Actualizar mapas</button>'; enlazarTarjetas(); } catch (e) { toast(e.message); }
      };
      const asg = card.querySelector('.asignar-caso');
      if (asg) asg.onclick = async () => { try { await api(`/docente/casos/${id}/mapas`, 'PUT', { mapas: mapasSel() }, H()); toast('Mapas actualizados'); } catch (e) { toast(e.message); } };
      card.querySelector('.borrar-caso').onclick = async () => { try { await api(`/docente/casos/${id}`, 'DELETE', null, H()); card.remove(); toast('Descartado'); } catch (e) { toast(e.message); } };
    });
  }

        ${lista.length ? `<table><thead><tr><th>Seudónimo</th><th>Grupo</th><th>Equipo</th><th>Casos</th><th>Puntos</th><th>Revisó antes</th><th>Seguro y falló</th><th>Insignias</th><th>Tarea real</th></tr></thead><tbody>
        ${lista.map(a => `<tr><td style="cursor:pointer" data-s="${esc(a.seudonimo)}"><b>${esc(a.seudonimo)}</b></td><td>${esc((YO.grupos.find(g => g.codigo === a.grupo) || {}).nombre || a.grupo || '')}</td><td>${escudoHtml(a.equipo)} ${a.equipo}</td><td>${a.casos}</td><td>${a.puntos ?? a.sentidos}</td><td>${a.reviso_antes ?? 0}</td><td>${a.abolladas ?? 0}</td><td>${a.insignias}</td>
          <td class="peq">${mapasDe(a.grupo).map(m => `<label style="display:flex;gap:6px;align-items:center;font-weight:400;margin:0 0 4px"><input type="checkbox" class="tr-chk" data-s="${esc(a.seudonimo)}" data-m="${m.id}" ${(a.transferencia || {})[m.id]?.aplico ? 'checked' : ''}> ${esc(m.nombre)}</label>`).join('') || '<span class="suave">sin mapas</span>'}</td></tr>`).join('')}

      [...$('contenido').querySelectorAll('.tr-chk')].forEach(c => c.onchange = async () => {

  // =====================================================================
  // Inicio: un solo campo para el tema, y un asistente de tres pasos
  // =====================================================================
  const pasosAsistente = n => `<ol class="pasos-asist">${['Tema', 'Tarea', 'Casos', 'Compartir'].map((t, i) =>
    `<li class="${i + 1 < n ? 'hecho' : i + 1 === n ? 'activo' : ''}"${i + 1 === n ? ' aria-current="step"' : ''}><b>${i + 1 < n ? '✓' : i + 1}</b>${t}</li>`).join('')}</ol>`;
  const misionDe = n => META.misiones.find(m => m.n === n) || {};

  VISTAS.inicio = async function () {
    const [yo, est, lista, productos] = await Promise.all([api('/docente/yo', 'GET', null, H()), api('/docente/generador/estado', 'GET', null, H()), api('/docente/casos', 'GET', null, H()), api('/docente/productos', 'GET', null, H())]);
    YO = yo;
    const niveles = META.marco_teorico?.niveles || [];
    const mios = misMapas();
    const pendientesDe = m => lista.filter(c => c.provisional && c.tema === m.nombre);
    $('contenido').innerHTML = `
      <section class="crear">
        <h1>¿Qué tema vas a trabajar?</h1>
        <p class="suave" style="margin:0;max-width:62ch">Escribe el tema de tu clase. ${est.configurado ? 'Critia prepara un caso para cada uno de los ocho territorios del mapa y tú los revisas antes de que los vean tus alumnos.' : 'Critia crea un mapa con ese nombre y usa los casos del banco base.'}</p>
        <label for="a-tema" class="oculto">Tema</label>
        <input type="text" id="a-tema" placeholder="Por ejemplo: el ciclo del agua" maxlength="60" autocomplete="off">
        <div class="crear-fila">
          <div><label for="a-tipo">¿Qué van a elaborar?</label>
            <select id="a-tipo">${productos.map(x => `<option value="${esc(x.clave)}">${esc(x.nombre)}</option>`).join('')}</select></div>
        </div>
        <label for="a-alcances">Alcances <span class="suave peq" style="font-weight:400">(opcional: extensión, fecha de entrega, qué se permite hacer con la IA)</span></label>
        <textarea id="a-alcances" maxlength="400" placeholder="Por ejemplo: una página. Pueden usar IA para buscar ideas, no para redactar." style="min-height:64px"></textarea>
        <div class="crear-fila"><div style="flex:0 1 240px"><label for="a-entrega">Fecha de entrega <span class="suave peq" style="font-weight:400">(opcional)</span></label><input type="date" id="a-entrega" style="width:100%;padding:11px 13px;font:inherit;border:1.5px solid #B9B29F;border-radius:10px"></div>
          <p class="peq suave" style="flex:1 1 260px;margin:0 0 6px">Ese día gana el equipo que tenga más territorios.</p></div>
        <div class="crear-fila">
          <div><label for="a-grupo">Grupo</label>
            <select id="a-grupo">${yo.grupos.map(g => `<option value="${esc(g.codigo)}">${esc(g.nombre)} · ${esc(nivelEdad(g.nivel || 2))}</option>`).join('')}<option value="">Crear un grupo nuevo…</option></select></div>
          <div class="nuevo-grupo"><label for="a-gnombre">Nombre del grupo</label><input type="text" id="a-gnombre" placeholder="Por ejemplo: 2.º A" maxlength="40"></div>
          <div class="nuevo-grupo"><label for="a-gnivel">Edad de los alumnos</label>
            <select id="a-gnivel">${niveles.map(n => `<option value="${n.n}" ${n.n === 2 ? 'selected' : ''}>${esc(n.edad)}</option>`).join('')}</select></div>
        </div>
        ${est.configurado ? '' : '<div class="nota-caja">Este servidor no tiene configurada la generación de casos nuevos. La actividad usará el banco base de Critia. El administrador puede activarla con la clave del modelo.</div>'}
        <button class="btn btn-primario" id="a-crear">Crear actividad</button>
        ${est.configurado ? `<details class="avanzado"><summary>Más opciones</summary>
          <label><input type="checkbox" id="a-base"> No generar casos nuevos; usar el banco base de Critia</label>
          <p class="peq" style="margin:4px 0 0">¿Prefieres elegir los postulados a mano? <button class="btn btn-enlace" id="a-avanzado" style="padding:0">Abrir «Generar con opciones»</button></p>
        </details>` : ''}
      </section>
      <h2 style="margin-top:28px">Tus actividades</h2>
      ${mios.length ? `<div class="actividades">${mios.map(m => { const pen = pendientesDe(m).length; const g = yo.grupos.find(x => x.codigo === m.codigo) || {}; return `
        <div class="actividad">
          <h3>${esc(m.nombre)}</h3>
          <div class="peq suave">Grupo ${esc(m.grupo_nombre)} · ${g.alumnos || 0} alumno(s)</div>
          <div><span class="peq suave">Código para alumnos</span><div class="codigo">${esc(m.codigo)}</div></div>
          ${m.tarea_tipo ? `<div class="peq"><span class="tag ${m.tarea_aprobada ? 'ok' : 'aviso'}">${esc((productos.find(x => x.clave === m.tarea_tipo) || {}).nombre || 'Tarea')}${m.tarea_aprobada ? '' : ' · propuesta sin aprobar'}</span></div>` : ''}
          <div class="peq">${m.solo_propios ? `${m.casos_propios} caso(s) aprobados` : `Banco base${m.casos_propios ? ` y ${m.casos_propios} caso(s) propios` : ''}`}${pen ? ` · <b>${pen} por revisar</b>` : ''}</div>
          <div class="fila-acciones">
            ${pen ? `<button class="btn btn-primario btn-peq act-revisar" data-id="${m.id}">Revisar casos</button>` : ''}
            ${m.tarea_tipo ? `<button class="btn btn-secundario btn-peq act-tarea" data-id="${m.id}">${m.tarea_aprobada ? 'Ver la tarea' : 'Revisar la tarea'}</button>` : ''}
            <button class="btn btn-secundario btn-peq act-compartir" data-id="${m.id}">Compartir</button>
            <a class="btn btn-enlace btn-peq" href="universo.html?grupo=${encodeURIComponent(m.codigo)}" target="_blank">Ver mapa de equipos</a>
          </div>
        </div>`; }).join('')}</div>` : '<div class="vacio">Todavía no tienes actividades. Escribe un tema arriba para crear la primera.</div>'}`;

    const selG = $('a-grupo');

      $('a-crear').disabled = true;

        let g = yo.grupos.find(x => x.codigo === selG.value);

    };
    const porId = id => { const m = mios.find(x => x.id === +id); return [yo.grupos.find(g => g.codigo === m.codigo), m]; };
    document.querySelectorAll('.act-tarea').forEach(b => b.onclick = async () => {
      const [g, m] = porId(b.dataset.id);

    document.querySelectorAll('.act-compartir').forEach(b => b.onclick = () => pasoCompartir(...porId(b.dataset.id)));
    document.querySelectorAll('.act-revisar').forEach(b => b.onclick = () => { const [g, m] = porId(b.dataset.id); pasoRevisar(g, m, pendientesDe(m), 0); });
  };

  function abrirAsistente(html) { enAsistente = true; $('subnav').innerHTML = ''; $('contenido').innerHTML = html; window.scrollTo(0, 0); }

  // Paso 2: Critia propone la tarea (consigna y un paso por territorio); el docente la edita y la aprueba
  function pasoTarea(g, m, t, alSeguir) {
    abrirAsistente(`${pasosAsistente(2)}
      <h2 style="margin:0">Critia propone esta tarea</h2>
      <p class="suave" style="margin:4px 0 14px">Actividad «${esc(m.nombre)}». Cada paso corresponde a un territorio del mapa y trabaja la misma habilidad que su caso. Cambia lo que quieras: los alumnos verán la tarea cuando la apruebes.</p>
      <div class="previa">
        <label for="t-entrega" style="margin-top:0">Fecha de entrega <span class="suave peq" style="font-weight:400">(opcional; ese día gana el equipo con más territorios)</span></label>
        <input type="date" id="t-entrega" value="${esc(t.entrega || '')}" style="padding:9px 12px;font:inherit;border:1.5px solid #B9B29F;border-radius:10px">
        <label for="t-consigna">Lo que se le pide al grupo</label>
        <textarea id="t-consigna" style="min-height:120px" maxlength="1200">${esc(t.consigna)}</textarea>
        ${t.pasos.map(p => `<div class="paso-tarea" data-n="${p.mision}">
          <div class="pt-cab"><b>${p.mision}</b><span>${esc(misionDe(p.mision).nombre || '')}</span></div>
          <label>Paso</label><input type="text" class="pt-titulo" maxlength="80" value="${esc(p.titulo)}">
          <label>Qué hace el alumno</label><textarea class="pt-ins" maxlength="600">${esc(p.instruccion)}</textarea>
          <label>Qué entrega</label><input type="text" class="pt-ent" maxlength="300" value="${esc(p.entregable || '')}">
        </div>`).join('')}
      </div>
      <div class="rev-acciones">
        <button class="btn btn-primario" id="t-ok">${t.aprobada ? 'Guardar cambios' : 'Aprobar la tarea'}</button>
        <button class="btn btn-enlace" id="t-salir" style="margin-left:auto">Seguir después</button>
      </div>`);
    $('t-ok').onclick = async () => {
      $('t-ok').disabled = true;
      const pasos = [...document.querySelectorAll('.paso-tarea')].map(d => ({ mision: +d.dataset.n, titulo: d.querySelector('.pt-titulo').value, instruccion: d.querySelector('.pt-ins').value, entregable: d.querySelector('.pt-ent').value }));
      try { await api(`/docente/mapas/${m.id}/tarea`, 'PUT', { consigna: $('t-consigna').value, pasos, aprobada: true, entrega: $('t-entrega').value }, H()); toast('Tarea aprobada'); alSeguir(); }
      catch (e) { toast(e.message, 6000); $('t-ok').disabled = false; }
    };
    $('t-salir').onclick = () => irA('inicio');
  }

  // Paso 3a: un caso por territorio, uno tras otro, para poder mostrar el avance
  async function pasoGenerar(g, m, tema) {
    abrirAsistente(`${pasosAsistente(3)}
      <h2>Preparando los casos de «${esc(tema)}»</h2>
      <p class="suave">Se prepara un caso por territorio. Cada uno tarda entre 20 y 60 segundos. No cierres esta página.</p>
      <ul class="gen-lista" id="gen-lista">${META.misiones.map(x => `<li data-n="${x.n}"><span><b>Territorio ${x.n}</b> · ${esc(x.nombre)}</span><span class="estado">en espera</span></li>`).join('')}</ul>
      <p class="peq suave" id="gen-pie" aria-live="polite" style="margin-top:12px"></p>`);
    const cola = [];
    // Un postulado distinto por territorio: se prefiere el que solo pertenece a ese territorio
    const veces = n => META.misiones.filter(x => x.postulados.includes(n)).length;
    const usados = new Set();
    for (const mis of META.misiones) {
      const post = mis.postulados.find(n => veces(n) === 1 && !usados.has(n)) ?? mis.postulados.find(n => !usados.has(n)) ?? mis.postulados[0];
      usados.add(post);
      const li = document.querySelector(`#gen-lista li[data-n="${mis.n}"]`);
      li.className = 'ahora'; li.querySelector('.estado').textContent = 'preparando…';
      $('gen-pie').textContent = `Territorio ${mis.n} de ${META.misiones.length}`;
      try {
        const r = await api('/docente/generar', 'POST', { tema, nivel: g.nivel || 2, postulados: [post], mision: mis.n, n: 1 }, H());
        if (r.aceptados.length) { cola.push(...r.aceptados); li.className = 'ok'; li.querySelector('.estado').textContent = 'listo para revisar'; }
        else { li.className = 'no'; li.querySelector('.estado').textContent = 'no pasó los filtros'; }
      } catch (e) { li.className = 'no'; li.querySelector('.estado').textContent = 'no se pudo preparar'; li.title = e.message; }
    }
    if (!cola.length) {
      $('gen-pie').innerHTML = `No se pudo preparar ningún caso. Puedes usar el banco base de Critia en esta actividad. <button class="btn btn-secundario btn-peq" id="gen-base">Usar el banco base</button>`;
      $('gen-base').onclick = async () => { await api(`/docente/mapas/${m.id}/solo-propios`, 'PUT', { valor: false }, H()); pasoCompartir(g, m); };
      return;
    }
    $('gen-pie').innerHTML = `${cola.length} caso(s) listos. <button class="btn btn-primario btn-peq" id="gen-sigue">Revisar los casos</button>`;
    $('gen-sigue').onclick = () => pasoRevisar(g, m, cola, 0);
    $('gen-sigue').focus();
  }

  function vistaPrevia(c) {
    const mis = misionDe(c.mision), h = habDe(c);
    return `<div class="previa">
      <span class="peq suave">Territorio ${c.mision} · ${esc(mis.nombre || '')}${h ? ' · habilidad: ' + esc(h.nombre) : ''}</span>
      <h2>${esc(c.titulo)}</h2>
      ${c.nivel_revision >= 3 ? '<div class="nota-caja" style="margin:0 0 12px">Este caso toca un tema delicado. Léelo completo antes de aprobarlo.</div>' : ''}
      <div class="globo-ia">${esc(c.situacion)}</div>
      <div class="preg">${esc(c.pregunta)}</div>
      ${(c.opciones || []).map(o => `<div class="op ${o.correcta ? 'ok' : ''}"><b>${esc(o.clave)}</b><span>${esc(o.texto)}${o.correcta ? ' <span class="tag ok">correcta</span>' : ''}</span></div>`).join('')}
      <dl>
        <dt>Primera pista</dt><dd>${esc(c.pista_suave || 'La pregunta general de la habilidad')}</dd>
        <dt>Segunda pista</dt><dd>${esc(c.pista_fuerte || c.pista || '')}</dd>
        <dt>Explicación</dt><dd>${esc(c.explicacion || '')}</dd>
        <dt>Reflexión</dt><dd>${esc(c.reflexion || '')}</dd>
      </dl></div>`;
  }

  // Paso 2b: revisar un caso a la vez
  function pasoRevisar(g, m, cola, i) {
    if (i >= cola.length) return pasoCompartir(g, m);
    const c = cola[i];
    abrirAsistente(`${pasosAsistente(3)}
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Revisa el caso ${i + 1} de ${cola.length}</h2><span class="peq suave">Actividad «${esc(m.nombre)}» · así lo verá el alumno, con la respuesta correcta marcada</span></div>
      <div style="margin-top:12px">${vistaPrevia(c)}</div>
      <div class="en-asistente oculto" id="rev-editar" style="margin-top:14px">${tarjetaCaso(c)}</div>
      <div class="rev-acciones">
        <button class="btn btn-primario" id="rev-ok">Aprobar</button>
        <button class="btn btn-secundario" id="rev-ed">Editar</button>
        <button class="btn btn-enlace" id="rev-no">Descartar este caso</button>
        <button class="btn btn-enlace" id="rev-salir" style="margin-left:auto">Seguir después</button>
      </div>`);
    enlazarTarjetas();
    const card = document.querySelector('#rev-editar .caso-edit');
    $('rev-ed').onclick = () => { $('rev-editar').classList.toggle('oculto'); if (!$('rev-editar').classList.contains('oculto')) $('rev-editar').scrollIntoView({ behavior: 'smooth' }); };
    card.querySelector('.guardar-caso').onclick = async () => {
      try {
        await card._guardar();
        cola[i] = (await api('/docente/casos', 'GET', null, H())).find(x => x.id === c.id) || c;
        pasoRevisar(g, m, cola, i);
      } catch (e) { toast(e.message, 6000); }
    };
    $('rev-ok').onclick = async () => {
      $('rev-ok').disabled = true;
      try { await api(`/docente/casos/${encodeURIComponent(c.id)}/aprobar`, 'POST', { mapas: [m.id] }, H()); pasoRevisar(g, m, cola, i + 1); }
      catch (e) { toast(e.message, 6000); $('rev-ok').disabled = false; }
    };
    $('rev-no').onclick = async () => {
      if (!confirm('¿Descartar este caso? No se puede recuperar.')) return;
      try { await api(`/docente/casos/${encodeURIComponent(c.id)}`, 'DELETE', null, H()); pasoRevisar(g, m, cola, i + 1); } catch (e) { toast(e.message); }
    };
    $('rev-salir').onclick = () => irA('inicio');
  }

  // Paso 3: el código y las instrucciones para los alumnos
  async function pasoCompartir(g, m) {
    const yo = await api('/docente/yo', 'GET', null, H()); YO = yo;
    const mapa = (yo.grupos.find(x => x.codigo === g.codigo)?.mapas || []).find(x => x.id === m.id) || m;
    const sitio = location.origin;
    const texto = `Critia · ${m.nombre}\n1. Entra a ${sitio}\n2. Escribe el código del grupo: ${g.codigo}\n3. Elige un seudónimo (no tu nombre real) y tu equipo.\n4. Abre el mapa «${m.nombre}» y resuelve los casos de hoy.`;
    abrirAsistente(`${pasosAsistente(4)}
      <div class="compartir">
        <h2 style="margin:0">La actividad «${esc(m.nombre)}» está lista</h2>
        <p class="suave" style="margin:6px 0 0">${mapa.solo_propios ? `${mapa.casos_propios} caso(s) aprobados.${mapa.casos_propios < 8 ? ' Los territorios sin caso aparecen como «pronto» en el mapa.' : ''}` : 'Usa el banco base de Critia.'}</p>
        <div class="peq suave" style="margin-top:18px">Código del grupo ${esc(g.nombre)}</div>
        <div class="codigo-grande">${esc(g.codigo)}</div>
        <ol>
          <li>Los alumnos entran a <b>${esc(sitio)}</b></li>
          <li>Escriben el código del grupo.</li>
          <li>Eligen un seudónimo (no su nombre real) y un equipo.</li>
          <li>Abren el mapa «${esc(m.nombre)}».</li>
        </ol>
        <div class="fila-acciones" style="justify-content:center">
          <button class="btn btn-primario" id="comp-copiar">Copiar instrucciones</button>
          <a class="btn btn-secundario" href="universo.html?grupo=${encodeURIComponent(g.codigo)}" target="_blank">Abrir el mapa de equipos para proyectar</a>
          <button class="btn btn-enlace" id="comp-fin">Volver al inicio</button>
        </div>
      </div>`);
    $('comp-copiar').onclick = async () => { try { await navigator.clipboard.writeText(texto); toast('Instrucciones copiadas'); } catch { prompt('Copia estas instrucciones:', texto); } };
    $('comp-fin').onclick = () => irA('inicio');
    pintarPestanas();
  }
})();
</script>
</body>
</html>
