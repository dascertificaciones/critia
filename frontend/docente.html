<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critia · Panel docente</title>
<link rel="stylesheet" href="assets/css/estilo.css">
<style>
  .contenedor { max-width: 1100px; }
  .pestanas { display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 20px; border-bottom: var(--trazo) solid var(--tinta); }
  .pestana { background: transparent; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px; color: var(--tinta-suave); padding: 10px 14px; font-weight: 700; cursor: pointer; font-size: 15px; font-family: var(--sans); }
  .pestana.activa { color: var(--tinta); border-bottom-color: var(--sello); }
  .pestana .n { background: var(--ambar); color: var(--tinta); border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--papel-3); vertical-align: top; }
  th { color: var(--tinta-suave); font-weight: 700; font-size: 13px; border-bottom: var(--trazo) solid var(--tinta); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 6px 0 22px; }
  .kpi { border-top: var(--trazo) solid var(--tinta); padding: 10px 0 0; }
  .kpi b { display: block; font-family: var(--serif); font-weight: 900; font-size: 40px; line-height: 1; color: var(--tinta); }
  .kpi span { font-size: 14px; color: var(--tinta-suave); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 2px solid var(--tinta-suave); color: var(--tinta-suave); background: transparent; }
  .tag.ok { color: var(--hierba); border-color: var(--hierba); } .tag.mal { color: var(--sello); border-color: var(--sello); } .tag.aviso { color: var(--tinta); border-color: var(--ambar); background: var(--ambar-claro); }
  .reflexion-card { border: var(--trazo) solid var(--tinta); border-radius: var(--r); padding: 16px; margin-bottom: 14px; background: #fff; }
  .reflexion-card .texto { background: var(--papel); border-left: 4px solid var(--tinta); padding: 10px 14px; margin: 10px 0; white-space: pre-wrap; font-size: 16px; }
  .rubrica { font-size: 14px; }
  .rubrica label { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 6px 0; cursor: pointer; }
  .rubrica input { width: 18px; height: 18px; accent-color: var(--hierba); }
  .fila-acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .fila-acciones input[type=text] { flex: 1; min-width: 200px; padding: 8px 12px; font-size: 14px; }
  .btn-peq { padding: 8px 14px; font-size: 14px; }
  .caso-detalle { background: var(--papel); border-radius: var(--r); padding: 12px; margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
  .barrita { height: 10px; border: 2px solid var(--tinta); border-radius: 5px; overflow: hidden; display: flex; background: var(--papel); }
  .barrita > i { display: block; height: 100%; }
  .b-ok { background: var(--hierba); } .b-mej { background: var(--ambar); } .b-mal { background: var(--sello); }
  .ficha-equipo { vertical-align: middle; margin-right: 6px; }
  details summary { cursor: pointer; font-weight: 700; }
  .vacio { color: var(--tinta-suave); padding: 24px 0; }
  .caso-edit label { margin-top: 10px; font-size: 14px; }
  .caso-edit input[type=text], .caso-edit textarea { font-size: 15px; padding: 8px 10px; }
  .caso-edit textarea { min-height: 72px; }
  @media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="contenedor">
  <header class="cabecera">
    <a class="logo" href="index.html"><span class="ojo" id="logo-ojo"></span>Critia <span class="suave" style="font-family:var(--sans);font-weight:400;font-size:14px;margin-left:6px">para docentes</span></a>
    <div class="jugador" id="estado"></div>
  </header>

  <!-- Clave -->
  <section id="login" class="tarjeta" style="max-width:520px">
    <h1>Panel docente</h1>
    <p class="suave">Nada de lo que veas aquí llega a los alumnos.</p>
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" placeholder="tu usuario" autocomplete="username">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" placeholder="tu contraseña" autocomplete="current-password">
    <div class="acciones"><button class="btn btn-primario" id="entrar">Entrar</button></div>
    <p class="peq suave" style="margin-top:14px">¿Eres el administrador? Deja el usuario vacío y escribe la clave de administrador.</p>
  </section>

  <!-- Panel -->
  <section id="panel" class="oculto">
    <div class="pestanas" id="pestanas"></div>
    <div id="contenido"></div>
  </section>
  <div class="pie-inst"><img src="assets/img/udemex.png" alt="Universidad Digital del Estado de México"><span>Hack4Edu 2026</span></div>
</div>

<script src="assets/js/iconos.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function () {
  document.getElementById('logo-ojo').innerHTML = ICONO.ojo;
  let auth = null;   // {tipo:'admin', clave} | {tipo:'docente', token}
  try { auth = JSON.parse(sessionStorage.getItem('ss_auth') || 'null'); } catch {}
  const H = () => auth?.tipo === 'admin' ? { 'x-admin': auth.clave } : { 'x-sesion': auth?.token || '' };
  let YO = null;     // {admin, usuario, nombre, grupos}
  const $ = s => document.getElementById(s);
  let META = null;

  const PESTANAS_BASE = [
    ['resumen', 'Resumen'], ['grupos', 'Grupos y mapas'], ['generar', 'Generar casos'], ['casos', 'Casos'],
    ['reflexiones', 'Reflexiones'], ['insignias', 'Insignias'], ['alertas', 'Alertas'], ['alumnos', 'Alumnos'],
  ];
  let PESTANAS = PESTANAS_BASE;
  let activa = 'resumen';

  async function abrirPanel() {
    YO = await api('/docente/yo', 'GET', null, H());
    PESTANAS = YO.admin ? [...PESTANAS_BASE.filter(p => p[0] !== 'grupos'), ['profesores', 'Profesores']] : PESTANAS_BASE;
    if (YO.admin && activa === 'grupos') activa = 'resumen';
    $('login').classList.add('oculto'); $('panel').classList.remove('oculto');
    META = await api('/meta');
    $('estado').innerHTML = `<span class="peq">${esc(YO.nombre)}</span><a class="btn btn-enlace" href="guia.html" target="_blank">guía</a><button class="btn btn-enlace" id="salir">salir</button>`;
    $('salir').onclick = async () => { if (auth?.tipo === 'docente') { try { await api('/docente/logout', 'POST', null, H()); } catch {} } try { sessionStorage.removeItem('ss_auth'); } catch {} location.reload(); };
    if (!YO.admin && !YO.grupos.length) { activa = 'grupos'; toast('Crea tu primer grupo, o únete a uno con su código, para que tus alumnos puedan entrar', 6000); }
    await pintarPestanas();
  }

  async function entrar() {
    const u = $('usuario').value.trim(), c = $('clave').value;
    try {
      if (!u) { auth = { tipo: 'admin', clave: c }; await api('/docente/yo', 'GET', null, H()); }
      else { const s = await api('/docente/login', 'POST', { usuario: u, password: c }); auth = { tipo: 'docente', token: s.token }; }
      try { sessionStorage.setItem('ss_auth', JSON.stringify(auth)); } catch {}
      await abrirPanel();
    } catch (e) { auth = null; toast(u ? 'Usuario o contraseña incorrectos' : 'Clave de administrador incorrecta'); }
  }
  $('entrar').onclick = entrar;
  $('clave').onkeydown = e => { if (e.key === 'Enter') entrar(); };
  $('usuario').onkeydown = e => { if (e.key === 'Enter') $('clave').focus(); };
  if (auth) abrirPanel().catch(() => { auth = null; try { sessionStorage.removeItem('ss_auth'); } catch {} });

  async function pintarPestanas() {
    const [ref, sug, ale] = await Promise.all([
      api('/docente/reflexiones', 'GET', null, H()), api('/docente/sugerencias', 'GET', null, H()), api('/docente/alertas', 'GET', null, H())]);
    const conteo = { reflexiones: ref.length, insignias: sug.length, alertas: ale.length };
    $('pestanas').innerHTML = PESTANAS.map(([k, n]) => `
      <button class="pestana ${k === activa ? 'activa' : ''}" data-k="${k}">${n}${conteo[k] ? `<span class="n">${conteo[k]}</span>` : ''}</button>`).join('');
    [...$('pestanas').children].forEach(b => b.onclick = () => { activa = b.dataset.k; pintarPestanas(); });
    await VISTAS[activa]();
  }

  // Mapas de los que el docente es autor (solo en esos puede aprobar casos)
  function misMapas() {
    return (YO?.grupos || []).flatMap(g => (g.mapas || []).filter(m => YO.admin || m.docente === YO.usuario).map(m => ({ ...m, grupo_nombre: g.nombre })));
  }
  function habDe(c) {
    const clave = c.habilidad || (META.postulados.find(p => p.n === c.postulado) || {}).habilidad;
    return (META.marco_teorico?.habilidades || []).find(h => h.clave === clave);
  }
  function habTxt(c) { const h = habDe(c); return h ? `${esc(h.nombre)} <span class="suave">(${esc(h.autor)})</span>` : ''; }
  const nivelEdad = n => ((META?.marco_teorico?.niveles || []).find(x => x.n === n) || {}).edad || '';
  const NIVEL = { 1: ['Automático', 'ok'], 2: ['Aprobación rápida', 'aviso'], 3: ['Lectura completa', 'mal'] };
  function tarjetaCaso(c) {
    return `<div class="reflexion-card caso-edit" data-id="${esc(c.id)}">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
        <div><span class="tag">${esc(c.id)}</span> <span class="tag ${NIVEL[c.nivel_revision]?.[1] || ''}">${NIVEL[c.nivel_revision]?.[0] || ''}</span> ${c.provisional ? '<span class="tag aviso">provisional</span>' : '<span class="tag ok">aprobado</span>'}</div>
        <div class="peq suave">Misión ${c.mision} · postulado ${c.postulado} · ${habTxt(c)}${c.nivel ? ' · <b>nivel ' + c.nivel + '</b>' : ''}${c.tema ? ' · tema: ' + esc(c.tema) : ''}</div>
      </div>
      <label>Título</label><input type="text" class="f-titulo" value="${esc(c.titulo)}">
      <label>Situación</label><textarea class="f-situacion">${esc(c.situacion)}</textarea>
      <label>Pregunta</label><input type="text" class="f-pregunta" value="${esc(c.pregunta)}">
      <label>Opciones <span class="peq suave">(marca la correcta)</span></label>
      ${(c.opciones || []).map((o, i) => `<div style="display:flex;gap:8px;align-items:center;margin:4px 0">
        <input type="radio" name="ok-${esc(c.id)}" value="${i}" ${o.correcta ? 'checked' : ''}>
        <b>${o.clave}</b><input type="text" class="f-op" data-i="${i}" value="${esc(o.texto)}" style="flex:1">
      </div>`).join('')}
      <label>Pista</label><input type="text" class="f-pista" value="${esc(c.pista)}">
      <label>Explicación</label><textarea class="f-explicacion">${esc(c.explicacion)}</textarea>
      <label>Reflexión</label><input type="text" class="f-reflexion" value="${esc(c.reflexion || '')}">
      <label>Grupos que verán este caso</label>
      <div class="grupos-sel">${misMapas().map(m => `<label style="display:inline-flex;gap:6px;align-items:center;margin:0 14px 6px 0;font-weight:400"><input type="checkbox" value="${m.id}" ${(c.mapas || []).includes(m.id) ? 'checked' : ''}> ${esc(m.nombre)} <span class="peq suave">grupo ${esc(m.grupo_nombre)}</span></label>`).join('') || '<span class="peq suave">No tienes mapas todavía. Crea uno en "Grupos y mapas".</span>'}</div>
      <div class="fila-acciones">
        <button class="btn btn-secundario btn-peq guardar-caso">Guardar cambios</button>
        ${c.provisional ? '<button class="btn btn-primario btn-peq aprobar-caso">Aprobar para esos mapas</button>' : '<button class="btn btn-secundario btn-peq asignar-caso">Actualizar mapas</button>'}
        <button class="btn btn-enlace btn-peq borrar-caso" style="color:var(--mal)">Descartar</button>
      </div></div>`;
  }
  function leerTarjeta(card) {
    const ops = [...card.querySelectorAll('.f-op')].map((inp, i) => ({ clave: 'ABC'[i], texto: inp.value, correcta: false, tipo_error: null }));
    const sel = card.querySelector('input[type=radio]:checked');
    const ci = sel ? +sel.value : 1;
    ops.forEach((o, i) => { o.correcta = i === ci; });
    return { titulo: card.querySelector('.f-titulo').value, situacion: card.querySelector('.f-situacion').value,
             pregunta: card.querySelector('.f-pregunta').value, pista: card.querySelector('.f-pista').value,
             explicacion: card.querySelector('.f-explicacion').value, reflexion: card.querySelector('.f-reflexion').value, opciones: ops };
  }
  function enlazarTarjetas() {
    [...document.querySelectorAll('.caso-edit')].forEach(card => {
      const id = card.dataset.id;
      const guardar = async () => {
        // conserva tipo_error de las incorrectas si existían
        const actual = (await api('/docente/casos', 'GET', null, H())).find(c => c.id === id);
        const cambios = leerTarjeta(card);
        cambios.opciones.forEach((o, i) => { if (!o.correcta) o.tipo_error = (actual?.opciones?.[i]?.tipo_error) || actual?.familia_error || 'acepta_sin_evidencia'; });
        await api(`/docente/casos/${id}`, 'PUT', { cambios }, H());
      };
      card.querySelector('.guardar-caso').onclick = async () => { try { await guardar(); toast('Guardado'); } catch (e) { toast(e.message); } };
      const mapasSel = () => [...card.querySelectorAll('.grupos-sel input:checked')].map(i => +i.value);
      const ap = card.querySelector('.aprobar-caso');
      if (ap) ap.onclick = async () => {
        const ms = mapasSel();
        if (!ms.length) { toast('Marca al menos un mapa'); return; }
        try { await guardar(); await api(`/docente/casos/${id}/aprobar`, 'POST', { mapas: ms }, H()); toast(`Aprobado para ${ms.length} mapa(s)`); card.querySelector('.tag.aviso').outerHTML = '<span class="tag ok">aprobado</span>'; ap.outerHTML = '<button class="btn btn-secundario btn-peq asignar-caso">Actualizar mapas</button>'; enlazarTarjetas(); } catch (e) { toast(e.message); }
      };
      const asg = card.querySelector('.asignar-caso');
      if (asg) asg.onclick = async () => { try { await api(`/docente/casos/${id}/mapas`, 'PUT', { mapas: mapasSel() }, H()); toast('Mapas actualizados'); } catch (e) { toast(e.message); } };
      card.querySelector('.borrar-caso').onclick = async () => { try { await api(`/docente/casos/${id}`, 'DELETE', null, H()); card.remove(); toast('Descartado'); } catch (e) { toast(e.message); } };
    });
  }

  const VISTAS = {
    async grupos() {
      const yo = await api('/docente/yo', 'GET', null, H()); YO = yo;
      const niveles = META.marco_teorico?.niveles || [];
      $('contenido').innerHTML = `<h2>Grupos y mapas</h2>
        <p class="suave" style="max-width:66ch">Un <b>grupo</b> es el salón: tiene un código de 6 letras, un nivel y sus equipos. Dentro del grupo, cada profesor crea su <b>mapa</b> (su materia o tema). Los alumnos entran una sola vez con el código y eligen en qué mapa trabajar. Los equipos compiten por territorios en todos los mapas; eso se ve en el <b>Universo</b>.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start">
          <div class="tarjeta" style="margin:0">
            <b>Crear un grupo nuevo</b>
            <p class="peq suave" style="margin:4px 0 8px">El nivel decide qué versión de los casos ven: ${niveles.map(n => `<b>${n.n}</b> = ${esc(n.edad)}`).join(' · ')}.</p>
            <input type="text" id="g-nombre" placeholder="Nombre del grupo, por ejemplo 2°A" maxlength="40">
            <div class="fila-acciones" style="margin-top:8px"><select id="g-nivel" style="width:auto">${niveles.map(n => `<option value="${n.n}" ${n.n === 2 ? 'selected' : ''}>Nivel ${n.n} · ${esc(n.edad)}</option>`).join('')}</select>
            <button class="btn btn-primario btn-peq" id="g-crear">Crear grupo</button></div>
          </div>
          <div class="tarjeta" style="margin:0">
            <b>Unirme a un grupo que ya existe</b>
            <p class="peq suave" style="margin:4px 0 8px">Si otro profesor ya creó el grupo, pídele el código y crea tu propio mapa dentro de él.</p>
            <div class="fila-acciones"><input type="text" id="g-unirse" placeholder="código de 6 letras" maxlength="6" style="text-transform:uppercase;letter-spacing:2px;font-weight:700"><button class="btn btn-secundario btn-peq" id="g-unirse-ok">Unirme</button></div>
          </div>
        </div>
        ${yo.grupos.length ? yo.grupos.map(g => `
          <div class="reflexion-card" style="margin-top:18px">
            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
              <div><span style="font-family:var(--serif);font-weight:700;font-size:20px">${esc(g.nombre)}</span>
                <span style="font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:3px;margin-left:12px">${esc(g.codigo)}</span>
                <span class="peq suave" style="margin-left:10px">${g.alumnos} alumno(s) · profesores: ${(g.profesores || []).map(p => esc(p.nombre)).join(', ')}</span></div>
              <div class="fila-acciones" style="margin:0">
                <select class="g-nivel-sel" data-c="${esc(g.codigo)}" data-n="${esc(g.nombre)}" style="width:auto;padding:4px 8px">${[1, 2, 3].map(n => `<option value="${n}" ${(g.nivel || 2) === n ? 'selected' : ''}>Nivel ${n} · ${esc(nivelEdad(n))}</option>`).join('')}</select>
                <a class="btn btn-secundario btn-peq" href="tablero.html?grupo=${esc(g.codigo)}" target="_blank">Tablero</a>
                <a class="btn btn-secundario btn-peq" href="universo.html?grupo=${esc(g.codigo)}" target="_blank">Universo</a>
              </div>
            </div>
            <table style="margin-top:10px"><thead><tr><th>Mapa (materia o tema)</th><th>Profesor</th><th>Casos propios aprobados</th><th></th></tr></thead><tbody>
              ${(g.mapas || []).map(m => `<tr><td><b>${esc(m.nombre)}</b></td><td>${esc(m.docente_nombre || m.docente)}</td><td>${m.casos_propios}</td>
                <td class="fila-acciones" style="margin:0">${(YO.admin || m.docente === YO.usuario) ? `<button class="btn btn-enlace btn-peq m-ren" data-id="${m.id}" data-n="${esc(m.nombre)}">Renombrar</button>` : ''}
                <a class="btn btn-enlace btn-peq" href="tablero.html?grupo=${esc(g.codigo)}&mapa=${m.id}" target="_blank">Tablero</a></td></tr>`).join('') || '<tr><td colspan="4" class="suave">Todavía no hay mapas en este grupo.</td></tr>'}
            </tbody></table>
            ${YO.admin ? '' : `<div class="fila-acciones" style="margin-top:8px"><input type="text" class="m-nombre" data-c="${esc(g.codigo)}" placeholder="Nuevo mapa: materia o tema, por ejemplo Geografía · Ríos de México" maxlength="60"><button class="btn btn-primario btn-peq m-crear" data-c="${esc(g.codigo)}">Crear mi mapa</button></div>`}
          </div>`).join('') : '<div class="vacio" style="margin-top:18px">Todavía no tienes grupos.</div>'}`;
      $('g-crear').onclick = async () => {
        const n = $('g-nombre').value.trim(); if (!n) return;
        try { const g = await api('/docente/grupos', 'POST', { nombre: n, nivel: +$('g-nivel').value }, H()); toast(`Grupo creado. Código: ${g.codigo}. Ahora crea tu mapa.`, 6000); VISTAS.grupos(); } catch (e) { toast(e.message); }
      };
      $('g-unirse-ok').onclick = async () => {
        const c = $('g-unirse').value.trim().toUpperCase(); if (c.length !== 6) { toast('El código tiene 6 letras'); return; }
        try { const r = await api('/docente/grupos/unirse', 'POST', { codigo: c }, H()); toast(`Te uniste al grupo ${r.nombre}. Crea tu mapa.`, 5000); VISTAS.grupos(); } catch (e) { toast(e.message); }
      };
      [...$('contenido').querySelectorAll('.g-nivel-sel')].forEach(sel => sel.onchange = async () => {
        try { await api(`/docente/grupos/${sel.dataset.c}`, 'PUT', { nombre: sel.dataset.n, nivel: +sel.value }, H()); toast('Nivel actualizado'); } catch (e) { toast(e.message); }
      });
      [...$('contenido').querySelectorAll('.m-crear')].forEach(b => b.onclick = async () => {
        const inp = $('contenido').querySelector(`.m-nombre[data-c="${b.dataset.c}"]`); const n = inp.value.trim(); if (n.length < 2) { toast('Escribe el nombre del mapa'); return; }
        try { await api('/docente/mapas', 'POST', { codigo: b.dataset.c, nombre: n }, H()); toast('Mapa creado'); VISTAS.grupos(); } catch (e) { toast(e.message); }
      });
      [...$('contenido').querySelectorAll('.m-ren')].forEach(b => b.onclick = async () => {
        const n = prompt('Nuevo nombre del mapa:', b.dataset.n); if (!n) return;
        try { await api(`/docente/mapas/${b.dataset.id}`, 'PUT', { nombre: n }, H()); VISTAS.grupos(); } catch (e) { toast(e.message); }
      });
    },

    async profesores() {
      const lista = await api('/admin/docentes', 'GET', null, H());
      $('contenido').innerHTML = `<h2>Profesores</h2>
        <p class="suave" style="max-width:60ch">Crea una cuenta por profesor. Cada uno entra con su usuario y contraseña, crea sus grupos y solo ve lo suyo.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;max-width:800px">
          <div><label>Usuario</label><input type="text" id="d-usuario" placeholder="p. ej. mlopez" maxlength="30"></div>
          <div><label>Nombre</label><input type="text" id="d-nombre" placeholder="María López" maxlength="60"></div>
          <div><label>Contraseña</label><input type="text" id="d-pass" placeholder="mínimo 6 caracteres" maxlength="60"></div>
          <button class="btn btn-primario btn-peq" id="d-crear" style="margin-bottom:2px">Crear</button>
        </div>
        ${lista.length ? `<table style="margin-top:18px"><thead><tr><th>Nombre</th><th>Usuario</th><th>Grupos</th><th>Estado</th><th></th></tr></thead><tbody>
          ${lista.map(d => `<tr><td><b>${esc(d.nombre)}</b></td><td>${esc(d.usuario)}</td><td>${d.grupos}</td><td>${d.activo ? '<span class="tag ok">activo</span>' : '<span class="tag mal">inactivo</span>'}</td>
            <td class="fila-acciones" style="margin:0"><button class="btn btn-secundario btn-peq d-pass" data-u="${esc(d.usuario)}">Nueva contraseña</button><button class="btn btn-enlace btn-peq d-act" data-u="${esc(d.usuario)}" data-a="${d.activo ? 0 : 1}">${d.activo ? 'Desactivar' : 'Activar'}</button></td></tr>`).join('')}
          </tbody></table>` : '<div class="vacio">Todavía no hay profesores.</div>'}`;
      $('d-crear').onclick = async () => {
        try { await api('/admin/docentes', 'POST', { usuario: $('d-usuario').value, nombre: $('d-nombre').value, password: $('d-pass').value }, H()); toast('Profesor creado'); VISTAS.profesores(); } catch (e) { toast(e.message, 5000); }
      };
      [...$('contenido').querySelectorAll('.d-pass')].forEach(b => b.onclick = async () => {
        const p = prompt(`Nueva contraseña para ${b.dataset.u} (mínimo 6 caracteres):`); if (!p) return;
        try { await api(`/admin/docentes/${b.dataset.u}/password`, 'PUT', { password: p }, H()); toast('Contraseña cambiada'); } catch (e) { toast(e.message); }
      });
      [...$('contenido').querySelectorAll('.d-act')].forEach(b => b.onclick = async () => {
        try { await api(`/admin/docentes/${b.dataset.u}/activo?activo=${b.dataset.a === '1'}`, 'PUT', null, H()); VISTAS.profesores(); } catch (e) { toast(e.message); }
      });
    },

    async generar() {
      const est = await api('/docente/generador/estado', 'GET', null, H());
      const misionDe = n => (META.misiones.find(m => m.postulados.includes(n)) || {}).nombre || '';
      $('contenido').innerHTML = `<h2>Generar casos desde un tema</h2>
        <p class="suave peq">Escribe el tema de tu clase. Cada caso presenta <b>una respuesta de IA</b> con un fallo que el alumno debe detectar, redactada para el nivel que elijas. El sistema redacta los casos con el modelo <b>${esc(est.modelo)}</b>, los pasa por filtros automáticos: estructura completa, una sola opción correcta, cuentas verificadas, sin datos personales, y un <b>filtro de consistencia</b> (el mismo modelo, sin ver la clave, debe llegar a la misma respuesta; si no, el caso se descarta). Estos filtros no comprueban que los datos sean ciertos: <b>tú apruebas cada caso</b> en la pestaña Casos antes de que lo vean los alumnos.</p>
        ${est.configurado ? '' : '<p class="tag mal" style="display:inline-block;margin-bottom:10px">El servidor no tiene clave del modelo (LLM_API_KEY). Pídele al administrador que la configure.</p>'}
        <label for="g-tema">Tema</label>
        <input type="text" id="g-tema" placeholder="por ejemplo: porcentajes y descuentos, la Independencia de México, alimentación" maxlength="120">
        <label>Postulados a practicar <span class="suave peq">(elige uno o varios; cada uno genera sus propios casos y apunta a su insignia)</span></label>
        <div class="post-grid">
          ${META.postulados.map(p => { const h = habDe({ postulado: p.n }) || {}; return `<label class="post-card"><input type="checkbox" class="g-post" value="${p.n}">
            <div><div class="post-titulo">${p.n}. ${esc(p.corto)} <span class="suave" style="font-weight:400">· ${esc(p.nombre)}</span></div>
            <div class="peq">${esc(p.descripcion || '')}</div>
            <div class="peq"><b>Habilidad:</b> ${esc(h.nombre || '')} <span class="suave">(${esc(h.autor || '')})</span> · <b>Insignia:</b> ${esc(p.insignia || '')} · <span class="suave">misión ${esc(misionDe(p.n))}</span></div></div></label>`; }).join('')}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px">
          <div><label for="g-nivel">Nivel</label>
            <select id="g-nivel">
              ${(META.marco_teorico?.niveles || []).map(n => `<option value="${n.n}" ${n.n === 2 ? 'selected' : ''}>${n.n} · ${esc(n.edad)}</option>`).join('')}
            </select></div>
          <div><label for="g-n">Cuántos por postulado</label>
            <select id="g-n">
              <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
            </select></div>
        </div>
        <div class="acciones"><button class="btn btn-primario" id="g-go" ${est.configurado ? '' : 'disabled'}>Generar</button><span id="g-estado" class="suave peq"></span></div>
        <div id="g-resultado"></div>`;
      $('g-go').onclick = async () => {
        const tema = $('g-tema').value.trim();
        if (tema.length < 3) { toast('Escribe un tema'); return; }
        const posts = [...$('contenido').querySelectorAll('.g-post:checked')].map(x => +x.value);
        if (!posts.length) { toast('Elige al menos un postulado'); return; }
        if (posts.length > 4) { toast('Máximo 4 postulados por vez'); return; }
        $('g-go').disabled = true; $('g-estado').textContent = `Generando y revisando ${posts.length} postulado(s)... entre 20 y 60 segundos por cada uno.`;
        try {
          const r = await api('/docente/generar', 'POST', { tema, nivel: +$('g-nivel').value, postulados: posts, n: +$('g-n').value }, H());
          $('g-estado').textContent = '';
          $('g-resultado').innerHTML = `
            <h2 style="font-size:16px;margin-top:20px">${r.aceptados.length} caso(s) listos para revisar · ${r.rechazados.length} descartado(s) por los filtros</h2>
            ${r.aceptados.map(c => tarjetaCaso(c)).join('')}
            ${r.rechazados.length ? `<details style="margin-top:12px"><summary class="suave">Ver descartados y por qué</summary>${r.rechazados.map(x => `<div class="reflexion-card"><b>${esc(x.caso.titulo || 'sin título')}</b><div class="peq suave">${x.motivos.map(esc).join(' · ')}</div></div>`).join('')}</details>` : ''}`;
          enlazarTarjetas();
          $('g-tema').value = '';
        } catch (e) { $('g-estado').textContent = ''; toast(e.message, 6000); }
        $('g-go').disabled = false;
      };
    },

    async resumen() {
      const r = await api('/docente/resumen', 'GET', null, H());
      const t = r.totales;
      const tasa = t.errores_ini ? Math.round(100 * t.mejoraron / t.errores_ini) : 0;
      $('contenido').innerHTML = `
        <h2>Resumen del grupo</h2>
        <div class="kpis">
          <div class="kpi"><b>${t.alumnos || 0}</b><span>alumnos activos</span></div>
          <div class="kpi"><b>${t.intentos || 0}</b><span>casos resueltos</span></div>
          <div class="kpi"><b>${t.errores_ini || 0}</b><span>errores iniciales</span></div>
          <div class="kpi"><b>${tasa}%</b><span>de errores corregidos tras la pista</span></div>
        </div>
        <h2 style="font-size:16px">Por caso</h2>
        <p class="suave peq">Verde: acertó sin pista. Ámbar: corrigió después de la pista. Rojo: siguió mal.</p>
        <table><thead><tr><th>Caso</th><th>N</th><th style="width:30%">Resultado</th><th>Conf. inicial → final</th><th>Dudas</th></tr></thead><tbody>
        ${r.por_caso.map(c => `<tr>
          <td><b>${esc(c.titulo)}</b><br><span class="peq suave">${c.caso_id}</span></td><td>${c.n}</td>
          <td><div class="barrita"><i class="b-ok" style="width:${100 * c.ok_ini / c.n}%"></i><i class="b-mej" style="width:${100 * c.mejoraron / c.n}%"></i><i class="b-mal" style="width:${100 * c.siguen_mal / c.n}%"></i></div>
              <span class="peq suave">${c.ok_ini} · ${c.mejoraron} · ${c.siguen_mal}</span></td>
          <td>${c.conf_ini_prom ?? '-'} → ${c.conf_fin_prom ?? '-'}</td><td>${c.dudas || ''}</td></tr>`).join('') || '<tr><td colspan="5" class="vacio">Aún no hay casos resueltos</td></tr>'}
        </tbody></table>
        <h2 style="font-size:16px;margin-top:20px">Errores más frecuentes</h2>
        <table><tbody>${r.por_familia.map(f => `<tr><td>${esc(f.familia)}</td><td>${f.n}</td></tr>`).join('') || '<tr><td class="vacio">Sin datos</td></tr>'}</tbody></table>`;
    },

    async reflexiones() {
      const lista = await api('/docente/reflexiones', 'GET', null, H());
      if (!lista.length) { $('contenido').innerHTML = '<h2>Reflexiones</h2><div class="vacio">No hay reflexiones pendientes de revisar.</div>'; return; }
      $('contenido').innerHTML = `<h2>Reflexiones por revisar</h2><p class="suave peq">Marca los criterios que cumple; el puntaje se calcula solo. La nota es opcional.</p>` +
        lista.map(r => `
          <div class="reflexion-card" data-id="${r.id}">
            <div><span class="tag">${esc(r.caso_id)}</span> <span class="peq suave">${esc(r.seudonimo)} · ${esc((r.cierre || '').slice(0, 16).replace('T', ' '))}</span></div>
            <p class="peq suave" style="margin-top:8px"><b>Pregunta:</b> ${esc(r.pregunta)}</p>
            <div class="texto">${esc(r.reflexion)}</div>
            <div class="rubrica">${r.rubrica.map((c, i) => `<label><input type="checkbox" data-c="${i}"> ${esc(c)}</label>`).join('')}</div>
            <div class="fila-acciones">
              <input type="text" placeholder="Nota para ti (opcional)" class="nota">
              <button class="btn btn-primario btn-peq guardar">Guardar revisión</button>
            </div>
          </div>`).join('');
      [...document.querySelectorAll('.reflexion-card .guardar')].forEach(b => b.onclick = async () => {
        const card = b.closest('.reflexion-card');
        const puntaje = [...card.querySelectorAll('input[type=checkbox]')].filter(c => c.checked).length;
        await api('/docente/revision', 'POST', { intento_id: +card.dataset.id, puntaje, nota: card.querySelector('.nota').value }, H());
        card.remove(); toast('Revisión guardada'); pintarPestanas();
      });
    },

    async insignias() {
      const sug = await api('/docente/sugerencias', 'GET', null, H());
      const nombre = n => { const p = META.postulados.find(p => p.n === n) || {}; return p.insignia ? `${p.insignia} (postulado ${n}: ${p.corto})` : p.corto || n; };
      $('contenido').innerHTML = `<h2>Insignias por confirmar</h2>
        <p class="suave peq">El sistema sugiere cuando un alumno aplicó un postulado en ${sug[0]?.casos?.length || 2}+ casos sin pista. Tú decides si la otorgas.</p>
        ${sug.length ? `<table><thead><tr><th>Alumno</th><th>Postulado</th><th>Mapa</th><th>Casos</th><th></th></tr></thead><tbody>
          ${sug.map(s => `<tr><td>${esc(s.seudonimo)}</td><td><img src="assets/insignias/p${String(s.postulado).padStart(2, '0')}.png" style="width:28px;vertical-align:middle;border-radius:50%;margin-right:6px" onerror="this.remove()">${esc(nombre(s.postulado))}</td>
            <td class="peq">${esc(s.mapa || '')}</td><td class="peq suave">${s.casos.join(', ')}</td>
            <td><button class="btn btn-primario btn-peq" data-s="${esc(s.seudonimo)}" data-p="${s.postulado}" data-m="${s.mapa_id || ''}">Otorgar</button></td></tr>`).join('')}
          </tbody></table>` : '<div class="vacio">No hay sugerencias por ahora.</div>'}
        <h2 style="font-size:16px;margin-top:20px">Otorgar a mano</h2>
        <div class="fila-acciones">
          <input type="text" id="ins-seu" placeholder="seudónimo">
          <select id="ins-p" style="width:auto">${META.postulados.map(p => `<option value="${p.n}">${p.n}. ${esc(p.insignia || p.corto)} · ${esc(p.corto)}</option>`).join('')}</select>
          <select id="ins-m" style="width:auto">${(YO?.grupos || []).flatMap(g => (g.mapas || []).map(m => `<option value="${m.id}">${esc(m.nombre)} · ${esc(g.nombre)}</option>`)).join('')}</select>
          <button class="btn btn-secundario btn-peq" id="ins-ok">Otorgar</button>
        </div>`;
      [...$('contenido').querySelectorAll('button[data-s]')].forEach(b => b.onclick = async () => {
        await api('/docente/insignia', 'POST', { seudonimo: b.dataset.s, postulado: +b.dataset.p, mapa: b.dataset.m ? +b.dataset.m : null }, H()); toast('Insignia otorgada'); pintarPestanas();
      });
      $('ins-ok').onclick = async () => {
        const s = $('ins-seu').value.trim(); if (!s) return;
        try { await api('/docente/insignia', 'POST', { seudonimo: s, postulado: +$('ins-p').value, mapa: $('ins-m').value ? +$('ins-m').value : null }, H()); toast('Insignia otorgada'); pintarPestanas(); }
        catch (e) { toast(e.message); }
      };
    },

    async alertas() {
      const a = await api('/docente/alertas', 'GET', null, H());
      const texto = { pista_no_funciona_o_clave_mal: 'Más del 80% sigue mal tras la pista: revisa la clave o la pista', demasiado_facil: 'Nadie se equivoca: puede ser demasiado fácil', alumnos_reportan_duda: 'Varios alumnos marcaron el caso como dudoso' };
      $('contenido').innerHTML = `<h2>Alertas sobre casos</h2><p class="suave peq">Se calculan con al menos 5 intentos por caso. Son señales para revisar, no veredictos.</p>` +
        (a.length ? `<table><thead><tr><th>Caso</th><th>Señal</th><th>N</th></tr></thead><tbody>${a.map(x => `<tr><td>${esc(x.caso_id)}</td><td><span class="tag aviso">${esc(texto[x.tipo] || x.tipo)}</span></td><td>${x.n}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Sin alertas. Hacen falta más intentos o todo va bien.</div>');
    },

    async casos() {
      const lista = await api('/docente/casos', 'GET', null, H());
      const niv = NIVEL;
      const prov = lista.filter(c => c.provisional);
      const resto = lista.filter(c => !c.provisional);
      $('contenido').innerHTML = `<h2>Casos por aprobar <span class="tag aviso">${prov.length}</span></h2>
        <p class="suave peq">Generados desde un tema. Revisa, corrige lo que haga falta y aprueba. Los alumnos los ven con un punto amarillo hasta entonces.</p>
        ${prov.length ? prov.map(tarjetaCaso).join('') : '<div class="vacio">No hay casos pendientes. Genera algunos en la pestaña Generar.</div>'}
        <h2 style="margin-top:24px">Banco aprobado <span class="tag ok">${resto.length}</span></h2>
        <table><thead><tr><th>ID</th><th>Título</th><th>Misión</th><th>Nivel (edad)</th><th>Habilidad</th><th>Revisión</th><th>Estado</th><th></th></tr></thead><tbody>
        ${resto.map(c => `<tr>
          <td class="peq">${esc(c.id)}</td>
          <td><details><summary>${esc(c.titulo)}</summary><div class="caso-detalle"><b>Situación:</b> ${esc(c.situacion)}\n\n<b>Pregunta:</b> ${esc(c.pregunta)}\n${(c.opciones || []).map(o => `\n${o.clave}) ${esc(o.texto)} ${o.correcta ? '✓' : ''}`).join('')}\n\n<b>Pista:</b> ${esc(c.pista)}\n\n<b>Explicación:</b> ${esc(c.explicacion)}</div></details></td>
          <td>${c.mision}</td>
          <td class="peq">${c.nivel ? `<b>${c.nivel}</b> · ${esc(nivelEdad(c.nivel))}` : '—'}</td>
          <td class="peq">${habTxt(c)}</td>
          <td><span class="tag ${niv[c.nivel_revision]?.[1] || ''}">${niv[c.nivel_revision]?.[0] || c.nivel_revision}</span></td>
          <td>${c.provisional ? '<span class="tag aviso">provisional</span>' : '<span class="tag ok">aprobado</span>'}</td>
          <td>${c.provisional ? `<button class="btn btn-primario btn-peq" data-id="${esc(c.id)}">Aprobar</button>` : ''}</td></tr>`).join('')}
        </tbody></table>`;
      enlazarTarjetas();
    },

    async alumnos() {
      const lista = await api('/docente/alumnos', 'GET', null, H());
      $('contenido').innerHTML = `<h2>Alumnos</h2><p class="suave peq">Solo seudónimos. Haz clic en uno para ver su historial.</p>
        ${lista.length ? `<table><thead><tr><th>Seudónimo</th><th>Grupo</th><th>Equipo</th><th>Casos</th><th>Sentidos</th><th>Insignias</th></tr></thead><tbody>
        ${lista.map(a => `<tr style="cursor:pointer" data-s="${esc(a.seudonimo)}"><td><b>${esc(a.seudonimo)}</b></td><td>${esc((YO.grupos.find(g => g.codigo === a.grupo) || {}).nombre || a.grupo || '')}</td><td>${escudoHtml(a.equipo)} ${a.equipo}</td><td>${a.casos}</td><td>${a.sentidos}</td><td>${a.insignias}</td></tr>`).join('')}
        </tbody></table><div id="hist"></div>` : '<div class="vacio">Nadie se ha registrado todavía.</div>'}`;
      [...$('contenido').querySelectorAll('tr[data-s]')].forEach(tr => tr.onclick = async () => {
        const h = await api(`/docente/alumnos/${tr.dataset.s}`, 'GET', null, H());
        $('hist').innerHTML = `<h2 style="font-size:16px;margin-top:20px">Historial de ${esc(tr.dataset.s)}</h2>
          <table><thead><tr><th>Caso</th><th>Inicial</th><th>Tutor</th><th>Revisada</th><th>Sentidos</th><th>Reflexión</th></tr></thead><tbody>
          ${h.map(i => `<tr>
            <td><b>${esc(i.titulo)}</b><br><span class="peq suave">${esc(i.inicio.slice(0, 16).replace('T', ' '))}</span></td>
            <td><span class="tag ${i.eval_ini === 'correcta' ? 'ok' : 'mal'}">${esc(i.clave_ini)} · ${i.conf_ini}</span>${i.just_ini ? `<br><span class="peq suave">"${esc(i.just_ini)}"</span>` : ''}</td>
            <td class="peq suave">${esc(i.accion_ini)}</td>
            <td><span class="tag ${i.eval_fin === 'correcta' ? 'ok' : 'mal'}">${esc(i.clave_fin)} · ${i.conf_fin}</span></td>
            <td>${i.sentidos.length}/3</td>
            <td class="peq">${esc(i.reflexion || '')}${i.reporta_duda ? ' <span class="tag aviso">dudó del caso</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="vacio">Sin casos cerrados</td></tr>'}
          </tbody></table>`;
        $('hist').scrollIntoView({ behavior: 'smooth' });
      });
    },
  };
})();
</script>
</body>
</html>
